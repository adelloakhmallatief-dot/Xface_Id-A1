name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # dibutuhkan untuk membuat GitHub Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # AGP 9.0 membutuhkan Gradle 9.1.0 atau lebih baru.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: Terima lisensi Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build APK (Standard + Lite)
        run: gradle assembleStandardDebug assembleLiteDebug --stacktrace

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: xface-id-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # Rilis "nightly": APK langsung (bukan zip), nama file tetap, ditimpa tiap build hijau di main.
      - name: Publikasikan rilis nightly
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cp "$(find app/build/outputs/apk -name '*standard*debug*.apk' | head -n 1)" dist/XFaceID-standard-debug.apk
          cp "$(find app/build/outputs/apk -name '*lite*debug*.apk' | head -n 1)" dist/XFaceID-lite-debug.apk
          gh release delete nightly --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create nightly dist/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Nightly build" \
            --notes "Build otomatis dari commit ${GITHUB_SHA::7}. APK debug untuk uji coba di HP Android. Pakai XFaceID-standard-debug.apk."

      - name: Unit test
        run: gradle :core:ai:testDebugUnitTest --stacktrace
        continue-on-error: true
