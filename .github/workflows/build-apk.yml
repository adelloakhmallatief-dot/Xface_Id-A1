name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # AGP 9.0 membutuhkan Gradle 9.1.0 atau lebih baru.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: Terima lisensi Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build APK (Standard + Lite)
        run: gradle assembleStandardDebug assembleLiteDebug --stacktrace

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: xface-id-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Unit test
        run: gradle :core:ai:testDebugUnitTest --stacktrace
        continue-on-error: true
