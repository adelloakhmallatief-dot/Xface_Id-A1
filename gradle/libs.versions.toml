[versions]
# Versi diverifikasi dari developer.android.com / kotlinlang pada 7 Nov 2026.
agp = "9.0.1"            # AGP 9.0 butuh Gradle 9.1.0+, Kotlin sudah built-in
kotlin = "2.2.10"        # Sama dengan dependensi runtime KGP bawaan AGP 9.0
compose = "1.12.1"       # compose.ui / foundation / runtime (stabil)
material3 = "1.4.0"      # compose.material3 (stabil)
camerax = "1.6.2"        # CameraX stabil
activityCompose = "1.13.0"
coreKtx = "1.18.0"
lifecycle = "2.11.0"
# PERLU DICEK: halaman MediaPipe hanya menulis "latest.release" (bisa jatuh ke build lama
# 0.20230731 yang salah urut). 0.10.35 saya ambil dari nomor rilis paket web MediaPipe,
# belum terverifikasi untuk artefak Maven Android. Jika sync gagal, pakai 0.10.x terbaru
# di Maven Central. Hindari 1.x sebelum memeriksa kebijakan telemetrinya.
mediapipe = "0.10.35"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

mediapipe-tasks-vision = { group = "com.google.mediapipe", name = "tasks-vision", version.ref = "mediapipe" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

androidx-compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "compose" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "compose" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }

androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# Dengan AGP 9 plugin org.jetbrains.kotlin.android tidak dipakai lagi (Kotlin built-in).
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
